<div id="room-three-view">
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-view" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 5V3m8 2V3M3 10h18M9 10v9"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="icon-left" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
    <symbol id="icon-right" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1 8m1-14v6h-6"/></symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.6 13A8.5 8.5 0 0 1 11 3.4 8.5 8.5 0 1 0 20.6 13Z"/></symbol>
    <symbol id="icon-fan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M10.2 10.8C5 10 4.5 5.5 8 4s5.6 1 4.9 6M13.8 10.8c3.3-4.1 7.5-2.5 7.1 1.3S17 16.5 13 13.6M12 14c1.7 5-1.7 7.9-4.8 5.7S5.3 14.3 10.2 13"/></symbol>
    <symbol id="icon-door" viewBox="0 0 24 24"><path d="M5 21V4.5A1.5 1.5 0 0 1 6.5 3h9A1.5 1.5 0 0 1 17 4.5V21M3 21h18"/><circle cx="14" cy="12.5" r=".9"/></symbol>
    <symbol id="icon-power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.6 6.6a7.5 7.5 0 1 0 10.8 0"/></symbol>
    <symbol id="icon-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z"/></symbol>
    <symbol id="icon-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.2 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="icon-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5m0-5-5 5"/></symbol>
    <symbol id="icon-seat" viewBox="0 0 24 24"><path d="M6 11V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5"/><path d="M4 11h16v4H4zM6 15v5m12-5v5"/></symbol>
    <symbol id="icon-bed" viewBox="0 0 24 24"><path d="M3 18V6m0 7h18v5M21 13v-1a3 3 0 0 0-3-3h-7v4"/><circle cx="7" cy="10.5" r="1.6"/></symbol>
    <symbol id="icon-water" viewBox="0 0 24 24"><path d="M12 3.5s-6 6.6-6 10.5a6 6 0 0 0 12 0c0-3.9-6-10.5-6-10.5Z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"/></symbol>
    <symbol id="icon-ac" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="7" rx="2"/><path d="M6 9.5h12M8 15l-1 3m5-3v4m4-4 1 3"/></symbol>
    <symbol id="icon-lid" viewBox="0 0 24 24"><path d="M6 13h12a6 6 0 0 1-12 0ZM8 13V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v8M10 19l-1 2h6l-1-2"/></symbol>
    <symbol id="icon-curtain" viewBox="0 0 24 24"><path d="M3 4h18M5 4c0 6 1 11 3 16M19 4c0 6-1 11-3 16M5 4c2 5 4 7 4 16M19 4c-2 5-4 7-4 16"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  </defs></svg>
  <div class="room-stage" role="img" aria-label="Interactive first floor. Drag to look around. Use the arrow buttons or W A S D keys to move. Use the toolbar to choose a view."></div>
  <div class="walk-controls">
    <div class="movement-pad" role="group" aria-label="Walk around. Tap for a step or hold to keep moving.">
      <button class="move-button move-forward" type="button" data-move="forward" aria-label="Move forward" title="Move forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
      <button class="move-button move-left" type="button" data-move="left" aria-label="Move left" title="Move left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <button class="move-button move-back" type="button" data-move="back" aria-label="Move backward" title="Move backward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
      <button class="move-button move-right" type="button" data-move="right" aria-label="Move right" title="Move right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="room-toolbar" role="group" aria-label="Room controls" hidden>
    <div class="view-field select-field">
      <svg class="icon field-icon" aria-hidden="true"><use href="#icon-view"/></svg>
      <select data-view-select aria-label="Room view"><option value="inside">Back room · start</option><option value="front">Front room</option><option value="stairs">Stairs</option><option value="wash">Toilet &amp; shower</option><option value="balcony">Balcony</option><option value="room">Whole floor</option><option value="storage">Bed &amp; storage</option><option value="gallery">Sofa &amp; anime</option><option value="ceiling">Ceiling</option><option value="top">Top view</option></select>
      <svg class="icon select-chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
    </div>
    <div class="dock-group rotate-controls" role="group" aria-label="Rotate">
      <button class="icon-button" type="button" data-turn="-1" aria-label="Rotate room left" title="Rotate left"><svg class="icon" aria-hidden="true"><use href="#icon-left"/></svg></button>
      <button class="icon-button" type="button" data-turn="1" aria-label="Rotate room right" title="Rotate right"><svg class="icon" aria-hidden="true"><use href="#icon-right"/></svg></button>
    </div>
    <div class="dock-group zoom-controls" role="group" aria-label="Zoom">
      <button class="icon-button" type="button" data-zoom-step="-1" aria-label="Zoom out" title="Zoom out"><svg class="icon" aria-hidden="true"><use href="#icon-minus"/></svg></button>
      <button class="icon-button" type="button" data-zoom-step="1" aria-label="Zoom in" title="Zoom in"><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg></button>
    </div>
    <div class="dock-group toggle-controls" role="group" aria-label="Sound and fans">
      <button class="icon-button" type="button" data-sound aria-pressed="true" aria-label="Turn sound off" title="Sound on"><svg class="icon" aria-hidden="true"><use href="#icon-sound"/></svg></button>
      <button class="icon-button" type="button" data-fan aria-pressed="true" aria-label="Turn fan off" title="Fan on"><svg class="icon" aria-hidden="true"><use href="#icon-fan"/></svg></button>
    </div>
    <details class="room-options">
      <summary class="icon-button" aria-label="Room settings" title="Room settings"><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg></summary>
      <div class="options-panel">
        <fieldset class="circuit-controls"><legend>Switchboard</legend>
          <label><input type="checkbox" data-circuit="cove" aria-label="Cove lighting" checked /> Cove lighting</label>
          <label><input type="checkbox" data-circuit="desk" aria-label="Desk power" checked /> Desk power</label>
        </fieldset>
        <button type="button" class="front-tv-control" data-front-tv aria-pressed="true">Turn front TV off</button>
        <label class="control-label" for="sofa-color">Bed &amp; sofa theme</label>
        <div class="select-field"><select id="sofa-color" data-sofa-color aria-label="Bed and sofa theme"><option value="dustyBlue">Dusty blue</option><option value="camel">Camel</option><option value="terracotta">Terracotta</option><option value="navy">Midnight navy</option><option value="charcoal">Charcoal grey</option></select><svg class="icon select-chevron" aria-hidden="true"><use href="#icon-chevron"/></svg></div>
        <div class="range-heading"><label for="room-zoom">Zoom</label></div>
        <input id="room-zoom" data-zoom aria-label="Zoom" type="range" min="0" max="100" value="0" step="1" />
        <div class="range-heading"><label for="tv-tilt">TV tilt</label><output data-tv-angle for="tv-tilt">12°</output></div>
        <input id="tv-tilt" data-tv-tilt aria-label="TV screen tilt" type="range" min="0" max="25" value="12" step="1" />
      </div>
    </details>
  </div>
  <div class="interact-prompt" data-interact-prompt hidden>
    <span class="interact-ping" aria-hidden="true"></span>
    <div class="interact-card" role="group" aria-live="polite">
      <div class="interact-title" data-interact-title></div>
      <div class="interact-actions" data-interact-actions></div>
    </div>
  </div>
  <div class="interact-toast" data-interact-toast role="status" hidden></div>
  <div class="room-error" role="alert" hidden></div>
  <img class="anime-reference-source" src="./assets/anime-wall.jpg" alt="" hidden />
</div>
